# Ambiente para o Streamlit Community Cloud.
#
# O LibreOffice (soffice) vem do conda-forge -- NAO pelo apt/packages.txt,
# que quebrou quando o repositorio Debian bullseye chegou ao fim de vida.
# Assim o app volta a gerar o .pdf no servidor.
name: proposta-app
channels:
  - conda-forge
dependencies:
  - python=3.11
  - libreoffice
  - pip
  - pip:
      - streamlit
      - python-docx
      - docxtpl
      - docxcompose
      - openpyxl
      - pandas
      - num2words
      - sqlalchemy
      - psycopg2-binary
      - pymupdf
